services:
  catalogo-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-catalogo}
      POSTGRES_USER: ${DB_USER:-catalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - catalogo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [catalogo]

  catalogo:
    build: .
    environment:
      DB_URL: jdbc:postgresql://catalogo-db:5432/${DB_NAME:-catalogo}
      DB_USER: ${DB_USER:-catalogo}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:8080"
    depends_on:
      catalogo-db:
        condition: service_healthy
    networks: [catalogo]

volumes:
  catalogo-data:

networks:
  catalogo:
