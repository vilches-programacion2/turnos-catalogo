spring.application.name=turnos-catalogo
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.issuer=${JWT_ISSUER:https://turnos-reservas.local}
app.jwt.audience=${JWT_AUDIENCE:turnos-catalogo}
app.jwt.public-key=${JWT_PUBLIC_KEY}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Documentación interactiva deshabilitada; las consultas de negocio requieren JWT.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.catalogo=${APP_LOG_LEVEL:INFO}
server.error.include-message=never
server.error.include-stacktrace=never
